[package]
name = "netprobe"
version = "0.3.0"
edition = "2021"
description = "Config-driven infrastructure monitoring TUI for school IT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
